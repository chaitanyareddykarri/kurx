name: CD

on:
  push:
    branches: [main]        # auto-deploy to staging after CI
  release:
    types: [published]      # auto-deploy to production on GitHub Release

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kurx

jobs:
  # ── 1. Build & push Docker images to GHCR ─────────────────────────────────
  docker:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./admin/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Staging deploy — automatic on every push to main ───────────────────
  deploy-staging:
    name: Deploy to staging
    needs: docker
    runs-on: ubuntu-latest
    # Skips (green) until a staging target exists. To enable: set the repo variable STAGING_URL and the
    # secrets STAGING_HOST / STAGING_SSH_USER / STAGING_SSH_KEY / STAGING_ENV. (secrets can't be read in
    # `if:`, so we gate on the STAGING_URL variable as the "staging is configured" switch.)
    if: github.ref == 'refs/heads/main' && vars.STAGING_URL != ''
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/kurx
            echo "${{ secrets.STAGING_ENV }}" > .env
            echo "BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-api:sha-${{ github.sha }}" >> .env
            echo "WEB_IMAGE=${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}"     >> .env
            echo "ADMIN_IMAGE=${{ env.IMAGE_PREFIX }}-admin:sha-${{ github.sha }}" >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T backend curl -fsS http://localhost:8080/health || exit 1

  # ── 3. Production deploy — requires manual approval via GitHub Environment ─
  deploy-production:
    name: Deploy to production
    needs: [docker, deploy-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: production           # configure "Required reviewers" in repo Settings → Environments
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/kurx
            # Snapshot current image tags for rollback
            docker inspect kurx-backend --format '{{.Config.Image}}' > /opt/kurx/.rollback-api  || true
            docker inspect kurx-web     --format '{{.Config.Image}}' > /opt/kurx/.rollback-web  || true
            echo "${{ secrets.PRODUCTION_ENV }}" > .env
            echo "BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-api:sha-${{ github.sha }}" >> .env
            echo "WEB_IMAGE=${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}"     >> .env
            echo "ADMIN_IMAGE=${{ env.IMAGE_PREFIX }}-admin:sha-${{ github.sha }}" >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T backend curl -fsS http://localhost:8080/health || {
              # Auto-rollback: restart with previous image tags
              PREV_API=$(cat /opt/kurx/.rollback-api)
              PREV_WEB=$(cat /opt/kurx/.rollback-web)
              echo "Health check failed — rolling back to $PREV_API / $PREV_WEB"
              sed -i "s|BACKEND_IMAGE=.*|BACKEND_IMAGE=$PREV_API|" .env
              sed -i "s|WEB_IMAGE=.*|WEB_IMAGE=$PREV_WEB|"         .env
              docker compose up -d --remove-orphans
              exit 1
            }
