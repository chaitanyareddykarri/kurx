# Explicit project name: the working tree is reached through a symlink on some machines, and
# compose would otherwise derive a different name per path and orphan the volumes.
name: kurx

services:
  postgres:
    image: postgres:17
    container_name: kurx-postgres
    environment:
      POSTGRES_USER: kurx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kurx}
      POSTGRES_DB: kurx
    ports:
      # Host 5433, not 5432: a native Windows PostgreSQL service commonly holds 5432, and Windows
      # lets both processes bind it — the first binder silently wins every connection, so host tools
      # reach the wrong server and fail auth against a database that looks healthy in `docker ps`.
      # Same reason redis maps 6380 below. Nothing inside Docker is affected: the backend reaches
      # this over the compose network as `postgres:5432`. Host-side tests: KURX_TEST_PG_PORT=5433.
      - "5433:5432"
    volumes:
      - kurx_pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurx -d kurx"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    container_name: kurx-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # D-298. Starts with the default `up`. It is the slow one: the image pulls a ~250 MB signature
  # database and takes a minute or two before it answers a scan, so the first `up` after a fresh
  # pull is not quick. Set FILE_SCANNER=clamav to actually route uploads through it.
  clamav:
    image: clamav/clamav:1.4
    # clamav/clamav publishes amd64 ONLY — there is no arm64 build on any tag. Without this, `up` fails
    # outright on an Apple Silicon machine ("no matching manifest for linux/arm64/v8"), which is also the
    # real reason the four ClamAvUploadPathTests fail there rather than anything about the tests.
    # Emulated, so it is slower than native; on an amd64 host this line is a no-op.
    platform: linux/amd64
    container_name: kurx-clamav
    # No profile: a default `up` starts the whole stack. Note this is the heaviest service here — the
    # image is ~1 GB and `start_period: 120s` is real, because clamd loads its signature database
    # before it will answer a scan. It is also what `FILE_SCANNER=clamav` and the four
    # ClamAvUploadPathTests need, so having it up by default is what makes those pass.
    ports:
      - "3310:3310"
    healthcheck:
      # Not a port check: clamd binds the socket before the signature database is loaded, so a plain
      # TCP probe reports ready while every scan would still fail.
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s


  # ── Object storage (D-355 Phase 2) — OPT-IN ───────────────────────────────────────────────────
  # S3-compatible storage, which is what the certificate module targets in production. Behind the `s3`
  # profile because a default `up` should not need a trusted certificate authority to upload a file:
  # presigned URLs are always https, so browser-direct uploads to a local MinIO require TLS, and an XHR
  # has no click-through for an untrusted certificate — it just fails.
  #
  #   default (localdisk):  docker compose up -d
  #   S3 instead:           STORAGE_PROVIDER=s3 in .env, trust .caddy-local-ca.crt, then
  #                         docker compose --profile s3 up -d
  #
  # Speaks plain HTTP on the private network and is NOT published: the browser reaches it via minio-tls.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: kurx-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-kurx}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-kurx-dev-minio-change-me}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - kurx_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Creates the bucket, then exits. `backend` waits for this to COMPLETE, which is the difference between
  # "storage is up" and "storage is usable" — without it the first upload fails against a missing bucket.
  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: kurx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kurx http://minio:9000 '${AWS_ACCESS_KEY_ID:-kurx}' '${AWS_SECRET_ACCESS_KEY:-kurx-dev-minio-change-me}' &&
      mc mb --ignore-existing kurx/'${S3_BUCKET:-kurx-certificates}' &&
      echo 'bucket ready: ${S3_BUCKET:-kurx-certificates}'
      "
    restart: "no"

  # TLS in front of MinIO, for the browser only.
  #
  # Presigned URLs are emitted as https by the AWS SDK with no way to override, and S3StorageOptions
  # refuses a non-https S3_PUBLIC_ENDPOINT for that reason — so local S3 needs real TLS, not a relaxed
  # check. Caddy terminates it and forwards to MinIO over HTTP.
  #
  # The Host header is preserved deliberately: SigV4 signs the host, so a URL signed for localhost:9000
  # only verifies if MinIO sees that same host.
  #
  # NOTE: Caddy's local CA is not in any trust store. A browser upload is an XHR, which has no
  # click-through for a certificate warning — it simply fails. See .env.example for how to trust it, or
  # set STORAGE_PROVIDER=localdisk in .env to sidestep storage TLS entirely.
  minio-tls:
    profiles: ["s3"]
    image: caddy:2-alpine
    container_name: kurx-minio-tls
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "9000:9000"
    command: >
      caddy reverse-proxy --from https://localhost:9000 --to http://minio:9000 --internal-certs
    volumes:
      - kurx_caddydata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.api
    container_name: kurx-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=kurx;Username=kurx;Password=${POSTGRES_PASSWORD:-kurx}
      # DB-2 pool + timeout ceilings. Deliberately smaller than the production defaults: the postgres
      # container ships max_connections=100, and a dev machine commonly also has a test run, psql, or a
      # second compose stack against the same server. API and jobs hold separate pools, so this container's
      # ceiling is MaxPoolSize + JobsMaxPoolSize. See docs/deployment/CONNECTION_POOLING.md.
      Database__MaxPoolSize: ${DB_MAX_POOL_SIZE:-12}
      Database__JobsMaxPoolSize: ${DB_JOBS_MAX_POOL_SIZE:-6}
      Database__JobWorkerCount: ${DB_JOB_WORKER_COUNT:-4}
      Database__MinPoolSize: ${DB_MIN_POOL_SIZE:-1}
      Database__CommandTimeoutSeconds: ${DB_COMMAND_TIMEOUT_SECONDS:-30}
      Database__ConnectionTimeoutSeconds: ${DB_CONNECTION_TIMEOUT_SECONDS:-15}
      Database__ConnectionIdleLifetimeSeconds: ${DB_CONNECTION_IDLE_LIFETIME_SECONDS:-300}
      REDIS_CONNECTION: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      JWT_ISSUER: kurx
      JWT_AUDIENCE: kurx-app
      TICKET_HMAC_SECRET: ${TICKET_HMAC_SECRET:-dev-only-ticket-hmac-change-me}
      OTP_PEPPER: ${OTP_PEPPER:-dev-only-otp-pepper-change-me}
      # The OTP shields exist to stop one anonymous host enumerating phone numbers (D-005/D-038). A local
      # stack has no anonymous traffic — it has one developer signing in repeatedly, and the production
      # defaults (20/min per IP, 10/hour per IP) block that within minutes, which makes the sign-in flow
      # itself untestable. Overridable per-environment exactly so this can be relaxed where the threat
      # does not exist; unset in staging and production, where the defaults stand.
      RATE_LIMIT_OTP_PER_MIN: ${RATE_LIMIT_OTP_PER_MIN:-200}
      RATE_LIMIT_OTP_IP_PER_HOUR: ${RATE_LIMIT_OTP_IP_PER_HOUR:-500}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # D-302. The host LocalDiskStorage stamps into every presigned URL. The browser is what follows
      # these URLs, so it must be the *published host* port — not the container port, and not a port
      # nothing publishes (that was the original D-302 bug: every presigned banner, avatar and
      # attachment resolved to a refused connection). Now the same 5080 the whole repo defaults to.
      KURX_API_BASE: ${KURX_API_BASE:-http://localhost:5080}
      # D-274 first-SuperAdmin bootstrap. Read from the (gitignored) .env, never hardcoded here — a phone
      # number is PII and this file is committed. No-op unless set AND the platform has no SuperAdmin yet,
      # and it only grants the role to an account that already registered through the real OTP flow.
      SUPERADMIN_BOOTSTRAP_PHONE: ${SUPERADMIN_BOOTSTRAP_PHONE:-}
      # D-355. Object storage. `localdisk` is the dev default and the API REFUSES to start with it when
      # ASPNETCORE_ENVIRONMENT=Production, because container-local storage is destroyed by a redeploy
      # while the rows referencing it survive.
      #
      # The local MinIO stack was removed: presigned S3 URLs are always emitted as https, so browser
      # uploads needed a TLS proxy in front of MinIO, terminating with Caddy's own local CA — which no
      # browser trusts. The result was an upload that failed at the TLS handshake, before any request
      # reached the server, with nothing in the log to explain it. localdisk signs URLs against the
      # API's own origin, which the browser is already talking to, so that failure mode cannot occur.
      #
      # `S3Storage` is untouched and remains the production adapter. To exercise it locally, set
      # STORAGE_PROVIDER=s3 with S3_BUCKET/S3_REGION/S3_ENDPOINT in `.env` and point them at a real
      # S3-compatible endpoint over TLS the machine already trusts.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-localdisk}
      S3_BUCKET: ${S3_BUCKET:-kurx-certificates}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Server-side: private network, plain HTTP, no self-signed cert for .NET to distrust.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Browser-side: presigned URLs are SIGNED for this host, so it must be what the browser uses.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://localhost:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-kurx}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-kurx-dev-minio-change-me}
      # D-298. Defaults to `none` — scanning is off unless asked for, even though the daemon now starts
      # with the stack. Set FILE_SCANNER=clamav in .env to route uploads through it.
      FILE_SCANNER: ${FILE_SCANNER:-none}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      # D-323. Skips the govt-ID/PAN/bank proofs so a dev account can publish a public event, sell
      # tickets and receive a payout — every one of those proofs is answered by MockKycProvider, so
      # enforcing them here costs four submissions and establishes nothing. Defaults to `false`:
      # set IDENTITY_VERIFICATION_BYPASS=true in .env to open it. The API REFUSES TO START if it is
      # set while ASPNETCORE_ENVIRONMENT=Production, so this line cannot leak the gate into a real
      # deployment. Fraud/blacklist checks are unaffected.
      # Defaults to `true` HERE and nowhere else. This file is the local Docker development
      # environment, and every proof the flag relaxes is answered by MockKycProvider in it (the boot
      # log lists "KYC (mock — checks always approve)"), so enforcing the gate locally costs four
      # submissions per test account to reach a verdict the mock was always going to give — while
      # blocking public-event creation, paid organizing and payouts, i.e. most of what there is to
      # test. Nothing else defaults it on: the ECS task definition never sets it, so staging and
      # production stay enforced, and `AddKurxInfrastructure` throws at startup if it is ever true
      # with ASPNETCORE_ENVIRONMENT=Production — including from this file, so pointing compose at a
      # Production environment fails closed rather than quietly opening the gate.
      # Set IDENTITY_VERIFICATION_BYPASS=false in .env to exercise the real gate locally.
      IDENTITY_VERIFICATION_BYPASS: ${IDENTITY_VERIFICATION_BYPASS:-true}
    ports:
      # 5080 is the ONE dev API port. `dotnet run` (launchSettings) already serves 5080, and every
      # client default and `.env.example` say 5080 — so compose publishing
      # 5001 meant the two dev topologies were not interchangeable and mobile (`KURX_API_BASE` default
      # `localhost:5080`) could not reach a compose-run backend at all. Do not reintroduce a second port.
      - "5080:8080"
    volumes:
      # STORAGE_PROVIDER=localdisk writes uploads under LOCALDISK_ROOT (default `.localdata/storage`,
      # so /app/.localdata/storage given the image's WORKDIR). Without this volume that path lives in
      # the container's writable layer, and `docker compose up --build` recreates the container — so
      # every banner, avatar, chat attachment and certificate uploaded since the last build is
      # destroyed by the ordinary rebuild command. Postgres keeps the rows, which makes the loss look
      # like corruption rather than a wipe: the record still resolves to a URL that now 404s.
      # The image pre-creates the directory owned by APP_UID (see infra/Dockerfile.api), and Docker
      # seeds a fresh named volume from the image content, so ownership carries over and the
      # unprivileged process can still write.
      - kurx_storage:/app/.localdata/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # D-299 — liveness, not readiness. Pointing this at /health restarts the API whenever Postgres or
      # Redis hiccups, turning a recoverable dependency blip into a restart loop.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    # Starts with the default `docker compose up` — the whole stack comes up in one command.
    #
    # It was previously behind a `frontend` profile because running the front ends natively with
    # `npm run dev` is a common local loop, and a native dev server already holding :3000 makes this
    # container fail to bind — which fails the whole `up`, not just this service. That trade is
    # deliberately reversed: one command starting everything is worth more than tolerating a port
    # clash. If you do run `npm run dev` natively, stop it first or `docker compose up -d --scale web=0`.
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Browser runs on the host, so it reaches the backend via the published host port (5080), not the
        # container name. Baked at build time (NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
        # The dedicated admin console's public URL — web's former /host/admin/* pages redirect here (D-195).
        NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
    container_name: kurx-web
    environment:
      NODE_ENV: production
      # Server-side renders reach the backend over the compose network, not the host port.
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  admin:
    # Same reasoning as web above — see that comment.
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        # Same split as web: the browser reaches the backend on the published host port, and this is
        # baked into the client bundle at build time (NEXT_PUBLIC_*). Setting it at runtime instead
        # would never reach the browser.
        NEXT_PUBLIC_API_URL: http://localhost:5080
        # The public site, for links OUT of the console — the mirror of web's NEXT_PUBLIC_ADMIN_URL
        # (D-195). A reviewer has to be able to open the event they are judging, and the public event
        # page is served by web, not here: a relative /e/{slug} would 404 on the console's own origin.
        NEXT_PUBLIC_WEB_URL: http://localhost:3000
    container_name: kurx-admin
    environment:
      NODE_ENV: production
      # Server-side renders and middleware token refresh run inside the container, so they reach the
      # backend over the compose network — localhost:5080 does not exist in here.
      API_URL: http://backend:8080
    # The admin package starts on 3001 (`next start -p 3001`), so the container port is 3001.
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # MinIO's objects.
  kurx_miniodata:
  # Caddy's local CA, persisted so the certificate the browser is asked to trust stays the same.
  kurx_caddydata:
  # `17`, matching the postgres major above: a major upgrade cannot read the older cluster's data
  # directory, so the new major gets a new volume rather than failing to start on the old one.
  kurx_pgdata17:
  # Uploaded files for STORAGE_PROVIDER=localdisk. Survives `up --build`; removed only by an explicit
  # `docker volume rm kurx_kurx_storage` or `docker compose down -v`.
  kurx_storage:
