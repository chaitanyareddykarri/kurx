org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kept false because mobile_scanner 6.0.11 applies its own kotlin-android plugin, which Flutter's
# built-in Kotlin refuses to coexist with. file_picker 11.0.2 (which skips its own KGP under AGP 9 and
# expects built-in Kotlin) is instead given the Kotlin plugin explicitly in the root build.gradle.kts.
android.builtInKotlin=false
org.gradle.caching=false
kotlin.incremental=false
# file_picker (given Kotlin explicitly in build.gradle.kts) targets Kotlin JVM 21 while its Java targets
# 17, because under AGP 9 it skips setting kotlinOptions.jvmTarget. Android's D8/R8 re-targets every
# class to minSdk regardless of the intermediate bytecode version, so the mismatch is harmless here;
# downgrade the strict Gradle check to a warning so it doesn't fail the release build. (Phase 7 fix.)
kotlin.jvm.target.validation.mode=warning
